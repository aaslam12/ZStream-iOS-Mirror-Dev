name: ZStream
options:
  bundleIdPrefix: com.z-stream
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# libmpv (prebuilt xcframeworks) — Phase 0 spike for replacing AVPlayer, whose
# strict HLS/HDR validation has rejected otherwise-valid streams. GPL variant:
# fine for this hobby project, see MPVClient.swift/MPVRenderView.swift headers.
#
# NOTE: this is the dev-mirror variant of project.yml, used only in the
# private mirror repo handed to the other dev (see scripts/publish-dev-mirror.sh).
# The only difference from project.yml: ZStreamNativeSources is a prebuilt
# .xcframework here instead of a local source package, since that repo never
# contains the native resolver source.
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0
  ZStreamCore:
    path: Packages/ZStreamCore

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: "QH7N9KJY6K"
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

fileGroups:
  - Config.xcconfig

targets:
  ZStream:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ZStream/Sources
      - path: ZStream/Resources
      - path: Assets.xcassets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: ZStream/Sources/Info.plist
      properties:
        CELESTE_BASE_URL: $(CELESTE_BASE_URL)
        TMDB_ACCESS_TOKEN: $(TMDB_ACCESS_TOKEN)
        UILaunchScreen: {}
        # Exposes the app's Documents folder (where the log file now lives) via
        # the Files app / Finder, so logs can be pulled off-device even when
        # the app itself is frozen and the in-app log viewer is unreachable.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CELESTE_BASE_URL: $(CELESTE_BASE_URL)
        TMDB_ACCESS_TOKEN: $(TMDB_ACCESS_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Needs for proxying
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: ZStream/ZStream.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:court.fontaine.lol
    dependencies:
      - framework: ThirdParty/BoringSSL.xcframework
        embed: false
      - package: MPVKit
        product: MPVKit-GPL
      - package: ZStreamCore
      - framework: ZStreamNativeSources.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z-stream.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        # xcodegen's `framework:` dependency embeds/links ZStreamNativeSources.xcframework
        # but doesn't reliably add its containing dir to the search path that
        # `import ZStreamNativeSources` needs to resolve — set it explicitly.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
